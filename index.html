<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Ruleta de Opciones</title>
  <meta name="description" content="Ruleta para sortear opciones. Funciona offline.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff3b6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ruleta">
  <link rel="apple-touch-icon" href="icons/icon.png">
  <link rel="icon" type="image/png" href="icons/icon.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <h1 id="tituloRuleta">Ruleta</h1>
  </header>

  <!-- ===== VISTA: RULETA ===== -->
  <section class="view active" id="view-ruleta">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="400" height="400"></canvas>
    </div>
    
    <button class="spin-btn" id="spinBtn">
      <re-icon icon="refresh" size="20"></re-icon> GIRAR
    </button>

    <div class="hist">
      <h3>HISTORIAL</h3>
      <div id="historial"></div>
    </div>
  </section>

  <!-- ===== VISTA: OPCIONES ===== -->
  <section class="view" id="view-opciones">
    <div class="add-row">
      <input id="nuevaOpcion" placeholder="Nueva opción..." maxlength="40">
      <button id="addBtn"><re-icon icon="plus" size="20"></re-icon></button>
    </div>
    <ul id="lista"></ul>
    <div class="actions">
      <button id="clearBtn">
        <re-icon icon="trash" size="16"></re-icon> Limpiar opciones
      </button>
    </div>
  </section>

  <!-- ===== VISTA: RULETAS (guardadas) ===== -->
  <section class="view" id="view-ruletas">
    <div class="add-row">
      <input id="nombreRuleta" placeholder="Nombre de la ruleta..." maxlength="40">
      <button id="crearRuletaBtn"><re-icon icon="plus" size="20"></re-icon></button>
    </div>

    <p class="hint">Guarda varias ruletas y cárgalas cuando quieras.</p>

    <ul id="listaRuletas"></ul>

    <div class="actions">
      <button id="exportAllBtn">
        <re-icon icon="download" size="16"></re-icon> Exportar
      </button>
      <button id="importAllBtn">
        <re-icon icon="upload" size="16"></re-icon> Importar
      </button>
    </div>
    <input type="file" id="fileInputAll" accept="application/json" hidden>
  </section>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="ruleta">
      <re-icon icon="target" size="24"></re-icon>
      <span class="nav-label">Ruleta</span>
    </button>
    <button class="nav-item" data-tab="opciones">
      <re-icon icon="settings" size="24"></re-icon>
      <span class="nav-label">Opciones</span>
    </button>
    <button class="nav-item" data-tab="ruletas">
      <re-icon icon="folder" size="24"></re-icon>
      <span class="nav-label">Ruletas</span>
    </button>
  </nav>

  <!-- Modal Ganador -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <div class="label">Resultado</div>
      <div class="winner" id="winnerText">—</div>
      <button id="closeModal">Cerrar</button>
    </div>
  </div>

  <!-- NUEVO: Contenedor de Toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- NUEVO: Modal de Confirmación -->
  <div class="modal-bg" id="confirmBg">
    <div class="modal confirm-modal">
      <div class="label" id="confirmTitle">Confirmar</div>
      <p class="confirm-msg" id="confirmMsg">¿Estás seguro?</p>
      <div class="confirm-actions">
        <button id="confirmNo" class="btn-ghost">Cancelar</button>
        <button id="confirmYes" class="btn-danger">Sí, continuar</button>
      </div>
    </div>
  </div>

  <!-- NUEVO: Modal de Prompt (para renombrar) -->
  <div class="modal-bg" id="promptBg">
    <div class="modal">
      <div class="label">Renombrar</div>
      <input type="text" id="promptInput" class="prompt-input" maxlength="40">
      <div class="confirm-actions">
        <button id="promptNo" class="btn-ghost">Cancelar</button>
        <button id="promptYes" class="btn-primary">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/reicon@latest/cdn/reicon.js"></script>
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

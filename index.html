<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Ruleta de Opciones</title>
  <meta name="description" content="Ruleta para sortear opciones. Funciona offline.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff3b6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ruleta">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <h1>Ruleta de Opciones</h1>

  <div class="tabs">
    <button class="tab active" data-tab="ruleta">Ruleta</button>
    <button class="tab" data-tab="lista">Opciones</button>
  </div>

  <section class="view active" id="view-ruleta">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="400" height="400"></canvas>
    </div>
    <button class="spin-btn" id="spinBtn">GIRAR</button>

    <div class="hist">
      <h3>HISTORIAL</h3>
      <div id="historial"></div>
    </div>
  </section>

  <section class="view" id="view-lista">
    <div class="add-row">
      <input id="nuevaOpcion" placeholder="Nueva opción..." maxlength="40">
      <button id="addBtn">+</button>
    </div>
    <ul id="lista"></ul>
    <div class="actions">
      <button id="saveBtn">Guardar</button>
      <button id="loadBtn">Cargar</button>
      <button id="exportBtn">Exportar</button>
      <button id="importBtn">Importar</button>
      <button id="clearBtn">Limpiar</button>
    </div>
    <input type="file" id="fileInput" accept="application/json" hidden>
  </section>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <div class="label">Resultado</div>
      <div class="winner" id="winnerText">—</div>
      <button id="closeModal">Cerrar</button>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
